# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Debian/Ubuntu, install the libpq headers first:
#   sudo apt-get install libpq-dev
#
# Configure connection details through the environment (a full DATABASE_URL also
# works and takes precedence over the keys below).
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "p0stgres") %>
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: fonquiapp_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: fonquiapp_test

# Store production database in a real PostgreSQL instance. The database-backed
# adapters for Rails.cache, Active Job, and Action Cable each get their own
# database so their tables and migrations stay isolated from the primary schema.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "fonquiapp_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "fonquiapp_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "fonquiapp_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "fonquiapp_production") %>_cable
    migrations_paths: db/cable_migrate
